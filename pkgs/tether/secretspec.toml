[project]
name = "tether"
revision = "1.0"

# Provider: keyring (KeePassXC via Secret Service). Each name below is a
# KeePassXC entry with the secret in the "Password" field; grant Secret Service
# access per entry. Populate with `secretspec check`, then:
#
#   secretspec run -- ./provision.sh      render /var/lib/tether.env on atlas
#   secretspec run -- ./tether sync       local dev against a scratch state dir
#
# LLAMA_API_KEY is intentionally absent: provision.sh reads it from
# /var/lib/llama-server.env on atlas, the single source of truth for that key.

[profiles.default]
TETHER_IMAP_USER = { description = "Gmail address", required = false, default = "ethanthoma@gmail.com" }
TETHER_IMAP_PASSWORD = { description = "Gmail app password (myaccount.google.com/apppasswords, needs 2FA; enter without spaces)", required = true }
TETHER_ICS_URL = { description = "Google Calendar settings -> your calendar -> Secret address in iCal format", required = true }
TETHER_NTFY_TOPIC = { description = "ntfy topic name (unguessable) or full URL for self-hosted ntfy", required = true }
TETHER_DISCORD_WEBHOOK = { description = "Discord webhook URL of a private channel", required = true }
